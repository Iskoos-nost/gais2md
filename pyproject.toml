[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gais2md"
version = "0.1.0"
description = "Convert Gemini AI Studio JSON exports into clean Markdown, HTML, and JSONL."
readme = "README.md"
authors = [{ name = "Iskender Usenbekov" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gais2md = "gais2md:main"
